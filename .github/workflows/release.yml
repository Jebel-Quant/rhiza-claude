name: Release

# Publish a GitHub release when a version tag is pushed.
# Prepare the tag with `/rhiza:release`, then push it.

on:
  push:
    tags:
      - 'v*'

# A release must never be interrupted mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    # CI budget: ≤15 min (two jq checks, git-cliff over the history, one API call).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/publish the GitHub release
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # persist-credentials: false even though this job writes a release. Nothing here
      # pushes over git: `gh release view` authenticates through GITHUB_TOKEN in the env,
      # release-action through its own token input, and git-cliff reads the local history
      # only (cliff.toml configures no remote integration). So the stored credential would
      # go unused, and a credential nothing uses should not be on disk.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest versions match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VER="${TAG#v}"
          PLUGIN=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          MKT=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$PLUGIN" != "$VER" ] || [ "$MKT" != "$VER" ]; then
            echo "::error::Version mismatch — tag=$VER plugin.json=$PLUGIN marketplace.json=$MKT. Run /rhiza:release and retag."
            exit 1
          fi
          echo "Versions match: $VER"

      - name: Refuse to overwrite a published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error::Release $TAG already exists and is not a draft."
              exit 1
            fi
            echo "::warning::Draft release $TAG exists — it will be updated."
          fi

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Publish GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.cliff.outputs.content }}
          allowUpdates: true
          makeLatest: true
