name: Release

# Publish a GitHub release when a version tag is pushed. `/rhiza:release` prepares the
# tag and pushes it; that push is the only thing that starts this.
#
# A pushed tag is the single entry point on purpose. This file used to be `workflow_call`
# -able as well, so a repo-local `auto-tag.yml` could tag a merged release itself and then
# ask this workflow to publish it. Two entry points meant two things racing to create the
# same tag: whichever lost got `Reference already exists (HTTP 422)` and a red run on a
# release that had in fact succeeded. The plugin's own two-phase flow is the one path now.

on:
  push:
    tags:
      - 'v*'

# A release must never be interrupted mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    # CI budget: ≤15 min (two jq checks, git-cliff over the history, one API call).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/publish the GitHub release
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # persist-credentials: false even though this job writes a release. Nothing here
      # pushes over git: `gh release view` authenticates through GITHUB_TOKEN in the env,
      # release-action through its own token input, and git-cliff reads the local history
      # only (cliff.toml configures no remote integration). So the stored credential would
      # go unused, and a credential nothing uses should not be on disk.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Everything below reads `steps.tag.outputs.tag` rather than the ref directly, so
      # the guards that follow have one value to hold to.
      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # `fetch-depth: 0` gets the history behind the pushed tag, not the other refs:
      # a tag-push checkout resolves one ref, so no branch is known and the earlier
      # releases may be absent. Both guards below need them. Anonymous over https,
      # which is all a public repo requires — the checkout persists no credential.
      - name: Fetch the branch and tag refs
        run: |
          git fetch --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      # A release cut on a branch that is then squash-merged leaves the tag on the
      # pre-squash commit: the merge puts the same content on main under a new SHA, and
      # nothing contains the old one. The tag is orphaned. That matters here rather than
      # cosmetically, because the notes below are `git-cliff --latest` — cliff cannot
      # place a boundary at an unreachable tag, so it silently attributes that version's
      # commits elsewhere. Publishing from such a tag is never what anyone meant.
      - name: Refuse a tag that no branch contains
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            echo "::error::Cannot resolve origin/$DEFAULT_BRANCH — refusing to publish without a reachability check."
            exit 1
          fi

          COMMIT=$(git rev-parse "$TAG^{commit}")
          if git merge-base --is-ancestor "$COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "$TAG ($COMMIT) is an ancestor of $DEFAULT_BRANCH"
            exit 0
          fi

          # Contained by some other branch: a maintenance release. Legitimate, but a
          # CHANGELOG regenerated from the default branch still cannot see it, so say so.
          BRANCHES=$(git branch -r --contains "$COMMIT" --format='%(refname:short)' | tr '\n' ' ')
          if [ -n "$BRANCHES" ]; then
            echo "::warning::$TAG is not an ancestor of $DEFAULT_BRANCH; it is contained in: $BRANCHES. A CHANGELOG regenerated from $DEFAULT_BRANCH will omit this release."
            exit 0
          fi

          echo "::error::$TAG points at $COMMIT, which no branch contains — most likely the pre-squash commit of a squash-merged release branch. Re-tag the merged commit on $DEFAULT_BRANCH and delete this tag."
          exit 1

      # A tag pushed from a branch that never caught up with main can publish backwards
      # — v0.6.1 after v0.6.2 — and `makeLatest: true` below would then point the
      # release everybody downloads at the older plugin. `sort -V` suffices because the
      # tag grammar is closed: .bumpversion.toml only ever writes X.Y.Z, and the filter
      # here drops anything that is not exactly that.
      - name: Refuse a tag that is not newer than the latest release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          LATEST=$(git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$TAG" \
            | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "$TAG is the first release"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$TAG" "$LATEST" | sort -V | head -1)" = "$TAG" ]; then
            echo "::error::Refusing to publish $TAG: it is not newer than the latest release $LATEST. Sync with the default branch and bump again."
            exit 1
          fi
          echo "$TAG is newer than $LATEST"

      - name: Verify manifest versions match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VER="${TAG#v}"
          PLUGIN=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          MKT=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$PLUGIN" != "$VER" ] || [ "$MKT" != "$VER" ]; then
            echo "::error::Version mismatch — tag=$VER plugin.json=$PLUGIN marketplace.json=$MKT. Run /rhiza:release and retag."
            exit 1
          fi
          echo "Versions match: $VER"

      - name: Refuse to overwrite a published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error::Release $TAG already exists and is not a draft."
              exit 1
            fi
            echo "::warning::Draft release $TAG exists — it will be updated."
          fi

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Publish GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.cliff.outputs.content }}
          allowUpdates: true
          makeLatest: true
