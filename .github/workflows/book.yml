name: Book

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build on every push/PR so each commit proves the book still builds. The
  # artifact is only ever consumed by the deploy job below.
  build:
    name: build
    # CI budget: ≤30 min. `make book` depends on `paper` and `test`, so this job runs
    # the whole suite — including the networked e2e fixtures — on top of tectonic and
    # mkdocs. It is the longest job here, and the budget is the tests' 20 plus the build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # A pinned release binary rather than a TeX Live install: tectonic fetches
      # only the packages the document actually uses, so this is seconds, not minutes.
      - name: Install tectonic
        env:
          TECTONIC_VERSION: 0.17.0
        run: |
          curl -fsSL \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tectonic
          tectonic --version

      # `make book` builds the paper first and stages it under docs/, so the PDF is
      # published with the site and every commit proves the .tex still compiles.
      - name: Build the book
        run: make book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book

  # Publish to GitHub Pages only from the default branch (never from a PR).
  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    # CI budget: ≤10 min (uploads the artifact build produced; no build of its own).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
