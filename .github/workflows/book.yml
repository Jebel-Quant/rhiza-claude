name: Book

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build on every push/PR so each commit proves the book still builds. The
  # artifact is only ever consumed by the deploy job below.
  build:
    name: build
    # CI budget: ≤30 min. `make book` depends on `paper` and `test`, so this job runs
    # the whole suite — including the networked e2e fixtures — on top of tectonic and
    # mkdocs. It is the longest job here, and the budget is the tests' 20 plus the build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned so a uv release cannot change what this builds without a commit saying
      # so. Dependabot bumps the action pin above, not this input.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'

      # This job downloads the widest tool set of any here — the test suite's, plus
      # mkdocs-material and genbadge. Its own cache key, for the reason ci.yml's lint
      # job explains: jobs sharing one key would each restore a cache saved for a
      # different tool set.
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-book-${{ hashFiles('Makefile', 'mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-uv-book-

      # A pinned release binary rather than a TeX Live install: tectonic fetches
      # only the packages the document actually uses, so this is seconds, not minutes.
      - name: Install tectonic
        env:
          TECTONIC_VERSION: 0.17.0
        run: |
          curl -fsSL \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tectonic
          tectonic --version

      # `make book` builds the paper first and stages it under docs/, so the PDF is
      # published with the site and every commit proves the .tex still compiles.
      #
      # The elapsed time goes to the step summary so the 30-minute budget above stays
      # a measurement rather than a guess.
      - name: Build the book
        run: |
          START=$(date +%s)
          make book
          echo "make book: $(($(date +%s) - START))s (budget: 30 min)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book

  # Publish to GitHub Pages only from the default branch (never from a PR).
  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    # CI budget: ≤10 min (uploads the artifact build produced; no build of its own).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
