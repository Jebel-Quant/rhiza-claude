name: Scorecard

# OpenSSF Scorecard supply-chain security analysis. Uploads SARIF to code
# scanning and (on public repos) publishes to the OpenSSF REST API, which
# powers the README badge. Auto-enables on public repos; set the
# SCORECARD_ENABLED repo variable to 'true'/'false' to override.

on:
  branch_protection_rule:
  schedule:
    - cron: '34 2 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

# Top level stays read-only: the OpenSSF publish step rejects results when
# id-token/security-events write scopes are granted workflow-wide, so those
# live only on the job below.
permissions:
  contents: read
  actions: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # CI budget: ≤15 min (a repo-wide supply-chain scan plus two uploads).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: |
      vars.SCORECARD_ENABLED == 'true' ||
      (vars.SCORECARD_ENABLED != 'false' && github.event.repository.visibility == 'public')
    permissions:
      security-events: write   # upload the SARIF results to code scanning
      id-token: write          # publish results to the OpenSSF REST API (badge)
      contents: read
      actions: read
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
