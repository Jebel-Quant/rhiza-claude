name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named for the gate, not the runner: this job is `make fmt`'s CI half, and the
  # tool underneath it has changed once already (pre-commit → prek). Renaming it is
  # now cheap — `ci-gate` below is the only context .github/rulesets/main-protection.json
  # requires, so the ruleset no longer names this job at all.
  lint:
    name: lint
    # CI budget: ≤10 min, and provisioning is what it covers, not the linting.
    # prek-action caches prek's own hook environments by default (`cache: true`),
    # so the repo hooks — markdownlint's node, ruff, gitleaks, actionlint — are
    # warm. What prek does not manage is the `language: system` half of
    # .pre-commit-config.yaml, which shells out to `uvx mypy`, `uvx interrogate`
    # and `uv run`; those download on every run unless uv's own cache is restored.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The one thing `make fmt` gives those hooks that prek-action cannot: the
    # UV_CONSTRAINT export. It is set in exactly one place — Makefile's
    # `export UV_CONSTRAINT := $(CURDIR)/requirements-dev.txt` — so a job that reaches
    # the hooks without going through make ran `uvx mypy` and `uvx interrogate`
    # against whatever release was newest at call time, while a contributor running
    # `make fmt` measured the pinned ones. Local and CI disagreed, and only CI floated.
    #
    # That is the precise failure requirements-dev.txt was written to prevent, and its
    # header claims the guarantee is total ("every `uvx` call is constrained from this
    # one file"). It held everywhere else — `make audit` below, `make test`,
    # `make portable`, `make book`, `make e2e` — and here, where make is
    # not the entry point, it did not. Dependabot bumps the pins either way, so the
    # review said "mypy 2.3.0" while the run installed something else.
    #
    # Set at job level rather than on the step: it then covers `make audit` too (make's
    # own `:=` wins, to the same path) and any future hook or step that shells out to
    # uvx, instead of fixing today's two by name.
    env:
      UV_CONSTRAINT: ${{ github.workspace }}/requirements-dev.txt
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # prek itself is a single Rust binary with no runtime, but the `language: system`
      # hooks in .pre-commit-config.yaml shell out to `uv run`/`uvx`. uv has to be on
      # PATH before prek runs, or every local hook fails.
      #
      # uv is pinned rather than floated so a uv release cannot change what CI measures
      # without a commit saying so. Dependabot updates the *action* pin above but not this
      # input, so bumping it stays manual (`uv self version` locally) — what is no longer
      # manual is noticing that it needs to happen everywhere at once. The `workflow-pins`
      # hook fails the build unless every `setup-uv` call site passes this input and all of
      # them agree, which is the check that was missing while one workflow shipped with no
      # pin at all. Six sites, one value: edit them together.
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.12.1'

      # Each job keys its own cache. A single shared key would be worse than none:
      # actions/cache skips the save when the key already matched, so the first job to
      # finish would fix the contents and the others would restore a cache missing
      # exactly the tools they need.
      #
      # Keyed on requirements-dev.txt as well as the hook config, now that UV_CONSTRAINT
      # above makes that file decide which mypy and interrogate get downloaded. Without
      # it a pin bump kept the old key, actions/cache skipped the save because the key
      # already matched, and the newly pinned version re-downloaded on every run.
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-lint-${{ hashFiles('.pre-commit-config.yaml', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-lint-

      # Runs `prek run --show-diff-on-failure --color=always --all-files`, i.e. the same
      # hook set as `make fmt`. prek-action stopped publishing major/minor aliases at
      # v3, so the comment names an exact release like every other pin here.
      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

      # Not a prek hook: bandit and zizmor cover the two surfaces the hooks do not —
      # the Python that shells out to git, and the workflows themselves. It lives in
      # the lint job because it is seconds of work and reuses the uv cache above.
      - name: Run make audit
        run: make audit

  tests:
    name: tests
    # CI budget: ≤20 min. `make test` measured 96s locally with all three toolchains
    # present; the headroom is for what CI adds — the glab download and the e2e
    # fixtures cloning jebel-quant/rhiza over the network, several times.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned for the reason the lint job spells out; Dependabot does not bump it.
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.12.1'

      # Keyed on the Makefile because that is where the tool set is declared — the
      # `uvx --with pytest-cov --with pyyaml pytest` line the `PYTEST` variable holds.
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-tests-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-uv-tests-

      # `gh` is preinstalled on GitHub's runners; `glab` is not. Without it, the half
      # of tests/scripts/test_platform_cli.py that checks our argv against `glab --help` skips
      # — and skipping is how `glab mr create --description-file` shipped, a flag glab
      # has never had, past a suite that only ever compared the code with itself.
      - name: Install glab
        env:
          GLAB_VERSION: 1.110.0
        run: |
          curl -fsSL -o glab.tar.gz \
            "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
          tar -xzf glab.tar.gz bin/glab
          sudo install -m 0755 bin/glab /usr/local/bin/glab
          rm -rf glab.tar.gz bin
          glab --version

      # The Rust and Go end-to-end fixtures build a real crate and module (`cargo init
      # --lib`, `go mod init`), and skip when the toolchain is absent. GitHub's runners
      # ship both, so this is normally a no-op — it is here to make an image that stops
      # shipping one fail loudly instead of silently skipping a whole language axis, which
      # is how a suite quietly stops covering a language.
      - name: Verify the toolchains the language fixtures need
        run: |
          cargo --version
          go version

      # The suite includes end-to-end tests that clone the real template
      # (jebel-quant/rhiza, at the ref pinned in tests/conftest.py) and drive each
      # command's script chain against a genuinely synced repo. They always run —
      # they are not opt-in — because the failures they catch are exactly the ones
      # that used to reach users: /quality unable to run at all, /update sweeping
      # repo-owned files into a template PR, /release missing a version location.
      # Invoke the make target rather than repeating its command line. This step used
      # to duplicate it, and the copies drifted the moment the Makefile gained
      # `--with pyyaml`: CI kept running without PyYAML, so `_rhiza_yaml`'s PyYAML arm
      # went unexercised and the coverage gate failed on a branch that was green
      # locally. One definition, in the Makefile.
      #
      # The elapsed time goes to the step summary because every job here carries a
      # "CI budget: ≤N min" comment and nothing was measuring them. A budget nobody
      # measures drifts into fiction.
      - name: Run tests with coverage gate
        run: |
          START=$(date +%s)
          make test
          echo "make test: $(($(date +%s) - START))s (budget: 20 min)" >> "$GITHUB_STEP_SUMMARY"

      # Every artefact `make test` writes belongs under _tests/, which is gitignored.
      # If the tree comes back dirty, a target wrote somewhere it should not have —
      # which on a release branch is how a stray file reaches a tag.
      - name: Verify the working tree is clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "::error::make test left the working tree dirty:"
            printf '%s\n' "$status"
            git diff
            exit 1
          fi

      # Uploaded even when the gate fails — especially then. Until now the measured
      # coverage only escaped a run via `make book` → Pages, so a PR that dropped under
      # 100% reported the failure with no way to see which lines caused it.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: _tests/
          if-no-files-found: ignore
          retention-days: 14

  # Everything above runs on Linux, and until this job existed that was the whole of the
  # evidence. The shipped scripts manipulate paths inside *other people's* repositories
  # during /rhiza:init and /rhiza:update, and they carry deliberate cross-platform
  # handling — `_rhiza_bundles.py` and `_rhiza_template.py` both normalise `\` to `/`
  # before a path is checked or joined — that nothing was verifying. A POSIX-only
  # assumption here escapes to a user's repo rather than failing in ours.
  #
  # It runs `make portable`, not `make test`: see that target's comment for why the e2e
  # fixtures and the coverage gate stay a Linux concern.
  cross-platform:
    name: cross-platform (${{ matrix.os }})
    # CI budget: ≤15 min. `make portable` measured 29s locally; the headroom is
    # provisioning, which is slower on the macOS and Windows images than on ubuntu.
    timeout-minutes: 15
    strategy:
      # Both legs always report. With fail-fast a Windows failure would cancel the macOS
      # run, and those two results answer different questions — "broken on Windows" and
      # "broken anywhere that isn't Linux" have different fixes.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on the Windows runner, so one script works on all three platforms and
        # GNU make finds a POSIX shell for the Makefile's `$(shell cat .python-version)`.
        shell: bash
    steps:
      # No harden-runner here, deliberately: its egress policy is implemented for the
      # Ubuntu images, so adding it to these two would read as coverage that isn't there.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.12.1'
          # setup-uv's own cache rather than the actions/cache blocks the jobs above use:
          # uv's cache directory differs per platform, and this hands that detail to the
          # action instead of hardcoding three paths behind a matrix expression.
          enable-cache: true

      # Installed rather than assumed: GNU make is guaranteed on the Ubuntu and macOS
      # images and is not something to depend on finding on the Windows one. choco is
      # preinstalled there, and the install is a no-op if the image already ships it.
      #
      # The alternative — calling pytest directly on Windows — is the one thing not to
      # do. The Makefile is the single definition of how the suite runs, and duplicating
      # its command line is exactly the drift that cost this repo a silently unmeasured
      # code path once already (see the `Run tests with coverage gate` step below).
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress --yes

      - name: Run the platform-portable test subset
        run: make portable

  # A single required status check standing in front of the whole workflow. Branch
  # protection is meant to name this context and nothing else, so `lint`, `tests` and
  # `cross-platform` can be renamed, split or replaced without re-applying
  # .github/rulesets/main-protection.json — which is a step that has to happen by hand,
  # and so is a step that gets forgotten. It was: the checked-in ruleset named `ci-gate`
  # while the live one still required `lint` and `tests` directly, so this job aggregated
  # a `cross-platform` result that nothing consumed and a red Windows leg could not block
  # a merge. Re-applying the file is the fix, and it is the only thing that makes the
  # paragraph above true — verify with:
  #   gh api repos/Jebel-Quant/rhiza-claude/rules/branches/main \
  #     --jq '.[] | select(.type=="required_status_checks")
  #                 | .parameters.required_status_checks[].context'
  #
  # Advisory by construction, not by choice: `build` (book.yml) and `install smoke test`
  # (plugin.yml) run on every PR and cannot join `needs:` below, because a job cannot
  # depend on one in another workflow. The same holds for codeql's `Analyze`. Requiring
  # them would mean naming their contexts in the ruleset directly — which is the coupling
  # this job exists to avoid, and would put merges behind `make book`, whose paper build
  # depends on an upstream CDN that rate-limits. They stay advisory deliberately; read
  # them, but they do not gate.
  #
  # Nothing but `success` passes. `skipped` is rejected because a job that never ran
  # has proved nothing, and `cancelled` because otherwise cancelling a run is a way to
  # turn the required check green. A run superseded by a newer push does report a red
  # gate, but against the SHA it was cancelled for — branch protection reads the head
  # commit, so that costs a strikethrough in the checks list and nothing else.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, tests, cross-platform]
    # CI budget: ≤5 min (it aggregates results; it runs nothing).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Verify every required job succeeded
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
          # One result for the whole matrix: GitHub collapses the legs into a single
          # `needs` entry, so a red Windows leg fails this whether or not macOS passed.
          CROSS: ${{ needs.cross-platform.result }}
        run: |
          echo "lint:           $LINT"
          echo "tests:          $TESTS"
          echo "cross-platform: $CROSS"
          if [ "$LINT" != "success" ] || [ "$TESTS" != "success" ] || [ "$CROSS" != "success" ]; then
            echo "::error::CI gate failed — lint=$LINT tests=$TESTS cross-platform=$CROSS."
            exit 1
          fi
          echo "All required CI jobs succeeded."
