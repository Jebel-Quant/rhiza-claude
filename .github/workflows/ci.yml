name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named for the gate, not the runner: this job is `make lint`'s CI half, and the
  # tool underneath it has changed once already (pre-commit → prek). The name is a
  # required status check in .github/rulesets/main-protection.json, so renaming it
  # again means re-applying that ruleset.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # prek itself is a single Rust binary with no runtime, but the `language: system`
      # hooks in .pre-commit-config.yaml shell out to `uv run`/`uvx`. uv has to be on
      # PATH before prek runs, or every local hook fails.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Runs `prek run --show-diff-on-failure --color=always --all-files`, i.e. the same
      # hook set as `make lint`. Pinned to an exact tag: prek-action stopped publishing
      # major/minor aliases at v3.
      - name: Run prek
        uses: j178/prek-action@v3.0.0

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # `gh` is preinstalled on GitHub's runners; `glab` is not. Without it, the half
      # of tests/scripts/test_platform_cli.py that checks our argv against `glab --help` skips
      # — and skipping is how `glab mr create --description-file` shipped, a flag glab
      # has never had, past a suite that only ever compared the code with itself.
      - name: Install glab
        env:
          GLAB_VERSION: 1.110.0
        run: |
          curl -fsSL -o glab.tar.gz \
            "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
          tar -xzf glab.tar.gz bin/glab
          sudo install -m 0755 bin/glab /usr/local/bin/glab
          rm -rf glab.tar.gz bin
          glab --version

      # The Rust and Go end-to-end fixtures build a real crate and module (`cargo init
      # --lib`, `go mod init`), and skip when the toolchain is absent. GitHub's runners
      # ship both, so this is normally a no-op — it is here to make an image that stops
      # shipping one fail loudly instead of silently skipping a whole language axis, which
      # is how a suite quietly stops covering a language.
      - name: Verify the toolchains the language fixtures need
        run: |
          cargo --version
          go version

      # The suite includes end-to-end tests that clone the real template
      # (jebel-quant/rhiza, at the ref pinned in tests/conftest.py) and drive each
      # command's script chain against a genuinely synced repo. They always run —
      # they are not opt-in — because the failures they catch are exactly the ones
      # that used to reach users: /quality unable to run at all, /update sweeping
      # repo-owned files into a template PR, /release missing a version location.
      # Invoke the make target rather than repeating its command line. This step used
      # to duplicate it, and the copies drifted the moment the Makefile gained
      # `--with pyyaml`: CI kept running without PyYAML, so `_rhiza_yaml`'s PyYAML arm
      # went unexercised and the coverage gate failed on a branch that was green
      # locally. One definition, in the Makefile.
      - name: Run tests with coverage gate
        run: make test
