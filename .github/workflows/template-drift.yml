name: Template drift

# Does the CURRENT rhiza template still agree with this plugin?
#
# The end-to-end tests pin a template ref (tests/conftest.py) so that PR runs are
# deterministic — CI must not turn red merely because upstream released. The cost of
# that is real: `make validate` was removed from the template between v1.1.3 and
# v1.2.1, /quality named it as a gate and scored the "No rule to make target" failure
# as FAIL, and it surfaced only because somebody bumped the pin by hand. Nothing was
# watching.
#
# This job watches. It runs the same end-to-end tests against the template's *latest*
# release, so upstream changes are found on the day they land. It is deliberately a
# separate workflow with its own name: a red "Template drift" means upstream moved and
# we no longer agree with it, which is a different fact from a red "CI" on a PR.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-drift
  cancel-in-progress: false

jobs:
  drift:
    name: e2e against the latest template
    # CI budget: ≤30 min. The e2e-only run is a subset of `make test`, but every
    # fixture in it clones the template — this is the network-heaviest job here.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # to raise the finding where it will be seen
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The issue-filing step below authenticates with GH_TOKEN in its own env, not with
      # a persisted git credential.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned like every other uv here, so the one job that talks to a *moving*
      # upstream holds everything else still. No uv cache: this job runs weekly and
      # GitHub evicts a cache after seven days of no reads, so it would rebuild the
      # entry every run and read it back never. What it spends is in git clones anyway.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.1'

      - name: Report the pinned ref against the latest release
        id: refs
        run: |
          pinned=$(grep -oE 'PINNED_TEMPLATE_REF = "[^"]+"' tests/conftest.py | cut -d'"' -f2)
          latest=$(git ls-remote --tags --sort=-v:refname \
            https://github.com/jebel-quant/rhiza \
            | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's|refs/tags/||')
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "::notice::pinned=$pinned latest=$latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::notice::the pin is behind; this run checks whether that matters"
          fi

      # Does the latest release still define every profile `/rhiza:init` writes? A
      # withdrawn or renamed profile is the one drift that cannot be caught by syncing,
      # because it stops the sync before it starts — and it lands on users at their first
      # `/rhiza:update`, not at `/init`. The e2e run below reaches every profile a fixture
      # syncs; this covers all of them, including profiles no fixture syncs, and reports a
      # withdrawal as one clear line rather than as a fixture failing to build.
      #
      # The list must name every profile `init_scaffold.py`'s `_PROFILES` table can write —
      # all four of `github-project`, `gitlab-project`, `rust-local`, `go-local`. Add a
      # language there and it belongs here too: `go-local` was once absent, and the effect
      # was that a withdrawn Go profile surfaced only as the Go fixture failing to build
      # minutes later, which is the illegible version of the same news.
      # `local` is checked as well and is the one exception: no `/rhiza:init` path writes
      # it, but a hand-written pointer can name it, so it stays.
      # Exit 1 (a profile is missing) fails the job and files the finding below. Exit 2
      # (the template could not be read) must not: a network blip is not upstream
      # withdrawing a profile, and filing a drift issue for it is how a weekly job earns
      # its reputation for crying wolf. The script separates the two precisely so a caller
      # can act differently — acting the same would waste that.
      - name: Check the latest release still defines the profiles /init writes
        env:
          LATEST: ${{ steps.refs.outputs.latest }}
        run: |
          set +e
          uv run --python 3.12 --no-project python plugin/scripts/check_template_profile.py \
            local rust-local go-local github-project gitlab-project \
            --template-repo jebel-quant/rhiza --ref "$LATEST"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::could not read jebel-quant/rhiza@${LATEST}; its profiles were not checked"
            exit 0
          fi
          exit "$status"

      # Only the end-to-end tests: they are the ones that touch the template. The target
      # drops the coverage gate, since a filtered run cannot meet 100% and coverage is not
      # the question being asked here.
      #
      # Through `make e2e`, not a hand-written `uvx pytest`, for the reason ci.yml's `Run
      # tests` step spells out: this step used to duplicate the command line and the copy
      # drifted the moment the Makefile gained `--with pyyaml`, so the drift job was
      # exercising the hand-rolled YAML parser while CI exercised PyYAML. One definition,
      # in the Makefile.
      #
      # The Rust axis is included and needs no env var: v1.3.0 shipped `rust-local`, so
      # the pinned PR runs exercise the sync too. `RHIZA_RUST_TEMPLATE_REF` still exists
      # for pointing the Rust fixtures at an unreleased branch by hand.
      - name: Run the end-to-end tests against the latest template
        env:
          RHIZA_TEMPLATE_REF: latest
        run: make e2e

      - name: Raise a finding if the template no longer agrees
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.refs.outputs.pinned }}
          LATEST: ${{ steps.refs.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Template drift: the plugin no longer agrees with jebel-quant/rhiza@${LATEST}"
          # Dedupe on the exact title so a weekly failure does not file a weekly issue.
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "The end-to-end tests pass against the pinned \`${PINNED}\` but fail against" \
            "the latest release \`${LATEST}\`." \
            "" \
            "That means upstream changed something this plugin depends on — a \`make\`" \
            "target renamed or removed, a synced file moved, a profile's bundles changed." \
            "Until it is reconciled, users on a current template hit the failure and the" \
            "pinned tests stay green, which is exactly the blind spot this job exists for." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "Do not fix this by bumping the pin alone — that hides the finding. Reconcile" \
            "the plugin with the change, then bump.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::commented on existing issue #${existing}"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
