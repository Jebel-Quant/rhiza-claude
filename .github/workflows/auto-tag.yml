name: Auto-tag

# Tag a merged release automatically, so cutting a release is two steps instead of four.
#
# `/rhiza:release` phase A opens a PR that bumps every declared version location. Merging
# that PR is the human decision — a person picked the version, watched the checks and
# consented. Everything after it is mechanical, so this does it: if the version the repo
# declares is ahead of the highest tag, the merged commit gets that tag and the release is
# published.
#
# The condition is the same one `/rhiza:release` uses to tell its two phases apart, and it
# is self-limiting: after tagging, declared == highest, so every ordinary merge that
# follows is a no-op. Nothing here fires unless a release PR just landed.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the merged release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the tag
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      created: ${{ steps.decide.outputs.created }}
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # persist-credentials: false even though this job creates a tag. The tag is made
      # through the API below rather than `git push`, so no git credential is needed and
      # none is left on disk — `make audit`'s zizmor pass flags a persisted one, and it
      # flagged this very job before the API approach replaced the push.
      # `fetch-depth: 0` brings the tags the comparison below reads.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Shell only, and deliberately so. This runs on *every* merge, and the answer is
      # almost always "nothing to do" — so the common path stays a few seconds of grep and
      # sort, with no toolchain to install. It also has to: installing uv unconditionally
      # made setup-uv's post-job cache save fail the whole run on the no-op path, because
      # nothing had resolved and there was no cache to write.
      - name: Decide whether a tag is due
        id: decide
        run: |
          DECLARED="$(grep -m1 '^current_version' .bumpversion.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          HIGHEST="$(git tag --list 'v*' | sort -V | tail -1)"
          TARGET="v${DECLARED}"
          echo "declared=${DECLARED}  highest=${HIGHEST:-none}  target=${TARGET}"

          if [ "$TARGET" = "$HIGHEST" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No release to tag: the declared version is already tagged."
            exit 0
          fi

          echo "tag=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.decide.outputs.created == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v7.1.1
        with:
          python-version: '3.12'

      # The guard is the bundled checker rather than a semver comparison re-derived in
      # shell: it is the same script `/rhiza:release` runs, it is tested, and it refuses an
      # existing tag as well as a non-increasing one. A declared version *below* the
      # highest tag lands here too — that means history was rewritten, and guessing is
      # exactly what the release flow refuses to do, so the job fails rather than tags.
      - name: Guard the version before tagging
        if: steps.decide.outputs.created == 'true'
        env:
          TARGET: ${{ steps.decide.outputs.tag }}
        run: |
          HIGHEST="$(git tag --list 'v*' | sort -V | tail -1)"
          if ! uv run --python 3.12 --no-project python \
                 plugin/scripts/check_version_bump.py "$TARGET" --current "${HIGHEST:-0.0.0}"; then
            echo "::error::$TARGET does not strictly increase past ${HIGHEST:-none}, or already exists. Not tagging."
            exit 1
          fi

      # Two calls because the tag is annotated, like the ones `/rhiza:release` creates: the
      # first makes the tag object, the second points a ref at it. A single `git/refs` call
      # would produce a lightweight tag instead, which carries no message or tagger.
      - name: Create the tag
        if: steps.decide.outputs.created == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SHA="$(git rev-parse HEAD)"
          OBJ="$(gh api "repos/$REPO/git/tags" \
                   -f tag="$TAG" -f message="release $TAG" \
                   -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$OBJ" --jq .ref
          echo "Tagged ${SHA:0:7} as $TAG"

  # Invoked explicitly rather than left to release.yml's tag-push trigger: a ref pushed
  # with GITHUB_TOKEN does not start further workflow runs, so the tag above would publish
  # nothing on its own. That silent half-release is the failure mode this call avoids.
  publish:
    name: Publish the release
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
