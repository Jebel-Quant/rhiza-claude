name: CodeQL

# Automated code scanning for Python (plugin/scripts/) and GitHub Actions workflows.
# Free for public repositories. Auto-enables on public repos; set the
# CODEQL_ENABLED repo variable to 'true'/'false' to override.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 1 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CI budget: ≤20 min per language. Both legs are build-mode `none`, so this is
    # extraction and query time over plugin/scripts/ and the workflows, not a build.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: |
      vars.CODEQL_ENABLED == 'true' ||
      (vars.CODEQL_ENABLED != 'false' && github.event.repository.visibility == 'public')
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
