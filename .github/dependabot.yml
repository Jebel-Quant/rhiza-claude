version: 2
updates:
  # Keep the pinned GitHub Actions in .github/workflows/ up to date.
  # (Dependabot has no ecosystem for hook revisions — use
  #  `uvx prek update` for .pre-commit-config.yaml.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # Keep the dev-toolchain pins in requirements-dev.txt up to date. These are the tools
  # `uvx` runs — prek, mypy, pytest, bandit, zizmor and the rest — not runtime
  # dependencies; the shipped plugin has none. Pinning them stops a tool release turning
  # CI red with no commit here, and watching them stops the pins quietly rotting instead.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-toolchain:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
