# Language-agnostic hooks for this Markdown/JSON plugin marketplace.
# Adapted from the rhiza core bundle — Python/uv hooks intentionally dropped.
#
# The runner is `prek` (see `make lint`), not `pre-commit`. The filename and schema
# are unchanged because prek reads this format as-is; nothing here is prek-specific,
# so the config stays runnable by either.
#
# Pin node so the runner provisions a compatible runtime for markdownlint
# instead of using an odd-numbered system node (EBADENGINE).
default_language_version:
  node: "24.12.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json          # validates the two plugin manifests
      - id: check-yaml
        args: ['--unsafe']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        # A SKILL.md is a prompt, not docs; CHANGELOG is generated.
        exclude: '^(plugin/skills/|CHANGELOG\.md|\.github/)'
        args: ["--disable", "MD013", "MD041"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
      - id: check-dependabot
        args: ["--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: manifest-version-parity
        name: plugin.json and marketplace.json versions must match
        entry: uv run --python 3.12 --no-project python plugin/scripts/check_version_parity.py
        language: system
        pass_filenames: false
        files: '^(plugin/\.claude-plugin/plugin|\.claude-plugin/marketplace)\.json$'
      - id: mypy
        name: mypy (strict type check of scripts/)
        entry: uvx mypy
        language: system
        pass_filenames: false
        files: '^(plugin/scripts/.*\.py|mypy\.ini)$'
      - id: interrogate
        name: interrogate (100% docstring coverage of scripts/)
        entry: uvx interrogate --ignore-nested-functions --fail-under=100 plugin/scripts
        language: system
        pass_filenames: false
        files: '^plugin/scripts/.*\.py$'
      - id: test-layout
        name: test layout mirrors sources (1:1 files + Test classes)
        # --src is the *plugin* root, not plugin/scripts: the checker mirrors nested
        # packages, so this makes `tests/scripts/` a requirement rather than a
        # convention. Rooted at plugin/scripts it passed for the wrong reason — both
        # sides were flat, so any arrangement satisfied parity.
        entry: uv run --python 3.12 --no-project python plugin/scripts/check_test_layout.py --src plugin --tests tests
        language: system
        pass_filenames: false
        files: '^(plugin/scripts|tests)/.*\.py$'
      # The prose is the other half of this plugin, and it fails differently: a stale
      # instruction doesn't halt anything, it gets improvised around mid-task in front
      # of a user. These two gate it. They also depend on scripts/, since a renamed
      # flag breaks the prose that passes it.
      - id: command-contracts
        name: prose commands are executable (scripts, flags, slash commands exist)
        entry: uv run --python 3.12 --no-project python plugin/scripts/check_command_contracts.py
        language: system
        pass_filenames: false
        # Includes the top-of-repo prose and the docs site: a dead script reference in
        # CONTRIBUTING.md used to survive precisely because no gate read that far.
        files: '^(plugin/(commands|skills|prompts)/.*\.md|plugin/scripts/.*\.py|docs/.*\.md|(README|CONTRIBUTING|CLAUDE|SECURITY)\.md)$'
      # Ruff's `S` rules police how a process is launched; this polices whether anyone
      # notices it failed. Ten of the sixteen call sites pass `check=False` and read the
      # returncode by hand — correct everywhere today, with nothing making it stay so.
      - id: subprocess-discipline
        name: every subprocess call accounts for a non-zero exit
        entry: uv run --python 3.12 --no-project python plugin/scripts/check_subprocess_discipline.py
        language: system
        pass_filenames: false
        files: '^plugin/scripts/.*\.py$'
      - id: prompt-wiring
        name: internal procedures under prompts/ stay wired up
        entry: uv run --python 3.12 --no-project python plugin/scripts/check_prompt_wiring.py
        language: system
        pass_filenames: false
        # Rule 4 reads the top-of-repo prose too, so a README edit that names a
        # procedure must trigger it. That was missing, and it is how a bad
        # `plugin/prompts/…` rewrite reached a commit.
        files: '^(plugin/((commands|skills|prompts)/.*\.md|scripts/.*\.py)|(README|CONTRIBUTING|CLAUDE|SECURITY)\.md)$'
      # `mkdocs build --strict` catches a nav entry with no page; it cannot catch a
      # command with no page, or a page missing from the nav. Those are the likely
      # directions, and CONTRIBUTING has required both since before anything checked.
      - id: docs-nav
        name: every command and procedure has a docs page, wired into the nav
        entry: uv run --python 3.12 --no-project python plugin/scripts/check_docs_nav.py
        language: system
        pass_filenames: false
        files: '^(plugin/(commands|skills|prompts)/.*\.md|docs/(commands|internals)/.*\.md|mkdocs\.yml)$'
      # docs-nav checks a page *exists*; this checks its facts are current. The
      # reference block on each page is generated from the frontmatter, so a renamed
      # argument or a widened allowed-tools list can't survive in the docs.
      - id: docs-reference-blocks
        name: generated docs reference blocks are up to date
        entry: uv run --python 3.12 --no-project python plugin/scripts/render_command_docs.py --check
        language: system
        pass_filenames: false
        files: '^(plugin/(commands|skills|prompts)/.*\.md|docs/(commands|internals)/.*\.md)$'

  # Shared hooks from the sibling repo. Selective by necessity: rhiza-claude is
  # deliberately *not* rhiza-managed, so most of what rhiza-hooks ships keys off a
  # `.rhiza/` directory that isn't here. An enabled-but-inert hook is worse than no
  # hook — it reads as coverage that doesn't exist — so each candidate was
  # negative-tested (break the thing it checks, confirm it fails) before landing.
  #
  # Rejected on evidence, not on inspection:
  #   check-makefile-targets     — passes with the `test` target deleted.
  #   check-bumpversion-config   — passes with [tool.bumpversion] renamed away.
  #     Both look for a pyproject.toml this repo doesn't have.
  #   check-rhiza-config, check-managed-files, check-template-bundles — need `.rhiza/`.
  #   check-rhiza-workflow-names — matches `rhiza_*.yml`; these workflows aren't.
  #   check-license-metadata, check-*-version-consistency — no pyproject.toml,
  #     no .python-version, no Cargo.toml, no go.mod.
  #   update-readme-help — see scripts/sync_readme_help.py, which is a *plugin*
  #     script /rhiza:docs runs inside someone else's repo. The hook only helps
  #     repos that adopt rhiza-hooks, so it cannot replace it.
  - repo: https://github.com/Jebel-Quant/rhiza-hooks
    rev: v1.0.0
    hooks:
      # Net-new: nothing here checked that a make target invoked by CI exists.
      # Verified to fail on `run: make totally-not-a-target`.
      - id: check-workflow-make-targets
