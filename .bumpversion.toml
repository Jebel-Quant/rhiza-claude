# Version locations for this repo, read by `bump-my-version` (see /rhiza:release).
#
# Every place the version is stated must be listed here, because a release is only
# coherent if they all move together. Each entry is an explicit search/replace, so
# nothing is inferred — a dependency that happens to share the current version number
# is never rewritten.
#
# `bump-my-version` also maintains `current_version` below, so the version is tracked
# here rather than discovered by scanning.

[tool.bumpversion]
current_version = "0.12.0"
tag = false                # /rhiza:release tags explicitly, after the changelog lands
commit = false             # ... and commits explicitly, so the diff is reviewable first
allow_dirty = false        # a release is cut from a clean tree

# This plugin's version lives in the two manifests, which must agree —
# scripts/check_version_parity.py enforces that, and the release workflow re-checks it.
#
# `search`/`replace` apply to *every* occurrence in a file, so each pattern must be
# unambiguous. Both manifests carry exactly one `"version"` key, so the plain form is
# safe here; a file with a second one would need `regex = true` and an anchored
# pattern (as a `pyproject.toml` does — see /rhiza:release step 6).
[[tool.bumpversion.files]]
filename = "plugin/.claude-plugin/plugin.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = ".claude-plugin/marketplace.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# The README's install examples pin the marketplace to a released tag. They are the
# first thing a reader copy-pastes, so a stale tag is worse than churn: left untracked
# they drifted three minor versions behind before anyone noticed. Both `marketplace add`
# lines carry the same text, and `search`/`replace` apply to every occurrence, so one
# entry moves both.
#
# The "switch versions" example further down is a `#<tag>` placeholder, not a version, so
# there is nothing here to track and nothing to age. It used to name an earlier release —
# it has to differ from the one above, since its whole point is that pinning moves in both
# directions — which meant no release could keep it current and it drifted three minor
# versions before anyone noticed.
# The paper stamps the release it describes — running head, title page, its "true of
# release vX" header, the pinned-install example and the honest-scope line. Its own header
# says a stale introduction is worse than none, so it is tracked here rather than
# hand-refreshed: it had drifted before, and nothing failed when it did.
#
# One pattern covers all five because they share the literal `v{current_version}`. The two
# `v0.6.0` references are safe by construction — they date the one screenshot that cannot
# be re-rendered, so they name an older release and this pattern cannot match them.
#
# The constraint that follows: **the paper must never name a version historically.** A
# sentence like "this changed in v0.8.0" would be rewritten into a falsehood on the next
# release. Say "this changed" and let the stamp date the document.
[[tool.bumpversion.files]]
filename = "paper/rhiza-claude-intro.tex"
search = "v{current_version}"
replace = "v{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = "Jebel-Quant/rhiza-claude#v{current_version}"
replace = "Jebel-Quant/rhiza-claude#v{new_version}"

# A repo whose CI stubs point at *itself* (the rhiza template does) must also bump
# those pins, or the published tag ships workflows calling the previous version's
# reusable workflows. This repo's `uses:` refs are all third-party, so there is
# nothing to declare — a template repo would add one entry per stub:
#
# [[tool.bumpversion.files]]
# filename = ".github/workflows/rhiza_ci.yml"
# search = "OWNER/REPO/.github/workflows/reusable.yml@v{current_version}"
# replace = "OWNER/REPO/.github/workflows/reusable.yml@v{new_version}"
