INHERIT: docs/mkdocs-base.yml

site_name: rhiza-claude
site_description: The rhiza Claude Code plugin — slash commands for working in rhiza-managed repos.
site_author: Jebel Quant
site_url: https://jebel-quant.github.io/rhiza-claude/
repo_url: https://github.com/jebel-quant/rhiza-claude
repo_name: jebel-quant/rhiza-claude
copyright: Copyright &copy; 2026 Jebel Quant

nav:
  - Home: index.md
  - Commands:
      - init: skills/init.md
      - update: skills/update.md
      - quality: skills/quality.md
      - docs: skills/docs.md
      - release: skills/release.md
      - remote: skills/remote.md
  - Repo utilities:
      - status: skills/status.md
      - maffay: skills/maffay.md
  - Machine setup:
      - completions: skills/completions.md
  - Destructive:
      - detach: skills/detach.md
  - Internals:
      - install-uv: internals/install-uv.md
      - pr-base: internals/pr-base.md
      - skeleton: internals/skeleton.md
      - design-analysis: internals/design-analysis.md
      - scorecard: internals/scorecard.md
      - known-issues: internals/known-issues.md
      - license: internals/license.md
      - python-version: internals/python-version.md
  - Without Claude Code: headless.md
  - Development: development.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jebel-quant/rhiza-claude

theme:
  icon:
    logo: material/leaf
